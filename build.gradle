plugins { id 'com.android.application' version '8.10.1' }
def original = file('android/AndroidManifest.xml').getText('UTF-8')
def appId = (original =~ /package="([^"]+)"/)[0][1]
def appVersion = (original =~ /versionName="([^"]+)"/)[0][1]
def code = ((original =~ /versionCode="([^"]+)"/)[0][1]) as int
def generated = file('build/generated/ledger/AndroidManifest.xml')
generated.parentFile.mkdirs()
generated.setText(original.replaceFirst(/ package="[^"]+"/, ''), 'UTF-8')
android {
 namespace 'cn.plainledger'
 compileSdk 35
 defaultConfig { applicationId appId; minSdk 26; targetSdk 35; versionCode code; versionName appVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 sourceSets { main { manifest.srcFile generated; java.srcDirs = ['android/src']; res.srcDirs = ['android/res']; assets.srcDirs = ['web'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs { local { storeFile file(providers.gradleProperty('ledgerKey').getOrElse('local-debug.keystore')); storePassword 'android'; keyAlias 'plainledger'; keyPassword 'android' } }
 buildTypes { debug { applicationIdSuffix '.ocrtest'; signingConfig signingConfigs.local }; release { minifyEnabled false; signingConfig signingConfigs.local } }
 sourceSets { androidTest { java.srcDirs = ['android/test']; assets.srcDirs = ['build/private-test-images'] } }
 packaging { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] }
}
dependencies { implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
