<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5669b2"><title>简账 · 把生活记清楚</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="calendar.css"><link rel="stylesheet" href="dropdowns.css"><link rel="stylesheet" href="desktop.css"><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="theme.css"></head>
<body><div id="app"><aside class="sidebar"><div class="brand"><span class="brandmark">简</span><div>简账<small>PLAIN LEDGER</small></div></div><div class="workspace"><span class="eyebrow">我的账本</span><select id="bookSelect" aria-label="选择账本"></select></div><nav id="nav"></nav><div class="sidefoot"><span class="dot"></span>离线存储 · 只属于你<small id="storageLabel">本地 SQLite 数据库</small></div></aside><main><header><div><div class="eyebrow">LESS NOISE, MORE LIFE</div><h1 id="pageTitle">收支明细</h1><select id="mobileBookSelect" class="mobile-book-select" aria-label="选择当前账本"></select></div><div class="header-actions"><input id="month" type="month" aria-label="选择月份"><button class="primary" id="addTop">＋ 记一笔</button></div></header><div id="content"></div><footer>简简单单记账，认认真真生活。<span>所有金额以人民币计 · 数据保存在本地</span></footer></main><button id="mobileAdd" class="floating" aria-label="记一笔">＋</button></div><dialog id="entryDialog"><form id="entryForm"><div class="modalhead"><div><span class="eyebrow">A LITTLE RECORD</span><h2 id="entryTitle">记一笔</h2></div><button type="button" class="iconbutton" data-close>×</button></div><div class="segmented" id="typeSwitch"><button type="button" data-type="expense" class="active">支出</button><button type="button" data-type="income">收入</button></div><label class="amount-label">金额<span class="money-input">¥ <input name="amount" inputmode="decimal" type="number" step="0.01" min="0.01" max="999999999" placeholder="0.00" required></span></label><label>选择分类<div id="categoryGrid" class="category-grid"></div></label><div class="formrow"><label>账户<select name="account" required></select></label><label>日期<input name="date" type="date" required></label></div><label>备注<input name="note" maxlength="120" placeholder="这一笔，记下什么？"></label><div class="modal-actions"><button type="button" class="danger ghost" id="deleteEntry" hidden>删除这笔</button><button type="button" data-close>取消</button><button class="primary" type="submit">保存记录</button></div><p class="form-error" id="entryError"></p></form></dialog><dialog id="manageDialog"><form id="manageForm"><div class="modalhead"><h2 id="manageTitle"></h2><button type="button" class="iconbutton" data-close>×</button></div><div id="manageFields"></div><p class="form-error" id="manageError"></p><div class="modal-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">保存</button></div></form></dialog><div id="toast" role="status"></div><script src="calendar.js"></script><script src="categories.js"></script><script src="auto-bill.js"></script><script src="reports.js"></script><script src="app.js"></script><script src="dropdowns.js"></script></body></html>
